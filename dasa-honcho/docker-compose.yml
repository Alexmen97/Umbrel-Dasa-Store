version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: dasa-honcho_api_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: 'false'

  api:
    entrypoint: ["sh", "-c", "/app/.venv/bin/python scripts/provision_db.py && /app/.venv/bin/python scripts/configure_embeddings.py --yes && exec /app/.venv/bin/fastapi run --host 0.0.0.0 --workers $${API_WORKERS:-1} src/main.py"]
    image: ghcr.io/plastic-labs/honcho:v3.2.2@sha256:c74955d6dbea6dda42c2dd9dd13dea726fcba36ba5c0b6bae4867f7ed762896d
    restart: on-failure
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://honcho:honchopassword@postgres:5432/honcho
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - AUTH_USE_AUTH=false
      - VECTOR_STORE_TYPE=pgvector
      # Configure your LLM & Embedding provider (e.g. OpenAI, Ollama, OpenRouter, Gemini)
      # - LLM_OPENAI_API_KEY=
      # - LLM_OPENAI_BASE_URL=
      # - LLM_ANTHROPIC_API_KEY=
      # - LLM_GEMINI_API_KEY=
      # Set model transports/models using the Honcho v3 configuration reference:
      # https://github.com/plastic-labs/honcho/blob/v3.2.2/config.toml.example
    volumes:
      - ${APP_DATA_DIR}/data/honcho:/app/data

  deriver:
    image: ghcr.io/plastic-labs/honcho:v3.2.2@sha256:c74955d6dbea6dda42c2dd9dd13dea726fcba36ba5c0b6bae4867f7ed762896d
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://honcho:honchopassword@postgres:5432/honcho
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      # Configure your LLM & Embedding provider (e.g. OpenAI, Ollama, OpenRouter, Gemini)
      # - LLM_OPENAI_API_KEY=
      # - LLM_OPENAI_BASE_URL=
      # - LLM_ANTHROPIC_API_KEY=
      # - LLM_GEMINI_API_KEY=
      # Set model transports/models using the Honcho v3 configuration reference:
      # https://github.com/plastic-labs/honcho/blob/v3.2.2/config.toml.example
    volumes:
      - ${APP_DATA_DIR}/data/honcho:/app/data

  postgres:
    image: pgvector/pgvector:pg15
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: honcho
      POSTGRES_USER: honcho
      POSTGRES_PASSWORD: honchopassword
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
