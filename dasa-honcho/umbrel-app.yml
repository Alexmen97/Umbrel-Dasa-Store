releaseNotes: >-
  Honcho v3.2.2 with OpenConcho v0.16.2 dashboard (store package revision 1).


  Opening the app now shows the OpenConcho dashboard, preconfigured for the bundled Honcho instance. The existing /v3 API endpoints, /health, and /docs remain available on port 8000. The dashboard proxy is restricted to the bundled API.


  Dashboard preferences are stored in your browser; Honcho data remains in the existing PostgreSQL volume. Back up the database before upgrading from Honcho v2.0.3 and configure your own LLM and embedding provider credentials for AI features.
