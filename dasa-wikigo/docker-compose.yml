version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: dasa-wikigo_web_1
      APP_PORT: 8080

  web:
    image: leomoonstudios/wiki-go:1.8.12@sha256:54a6a54a2ca77ffad30488e474f0468644e30eb077c70f1a24ef303d980cf5a9
    security_opt:
      - no-new-privileges:true
    user: 1000:1000
    restart: on-failure
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ${APP_DATA_DIR}/data:/wiki/data:rw
    environment:
       PUID: 1000
       PGID: 1000
