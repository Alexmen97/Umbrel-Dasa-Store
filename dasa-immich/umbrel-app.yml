manifestVersion: 1.1
id: dasa-immich
category: files & productivity
name: Immich
version: "v3.0.3"
tagline: High-performance photo and video backup solution
icon: https://i.imgur.com/wqT5bDn.png
description: >-
  ✨ Novità in v3: editor mobile non distruttivo, workflow sperimentali, backup in background più affidabile, controlli d’integrità e streaming video HLS in anteprima.


  An open-source and high-performance self-hosted backup solution for the videos and photos on your mobile device


  ⚠️ Immich is under very active development. Expect bugs and changes. Do not use it as the only way to store your photos and videos!


  Features:

  - Upload and view videos and photos

  - Auto backup when the app is opened

  - Selective album(s) for backup

  - Download photos and videos to a local device

  - Multi-user support

  - Album and Shared albums

  - Scrubbable/draggable scrollbar

  - Support RAW (HEIC, HEIF, DNG, Apple ProRaw)

  - Metadata view (EXIF, map)

  - Search by metadata, objects and image tags

  - Administrative functions (user management)

  - Background backup

  - Virtual scroll

  - OAuth support

  - LivePhoto backup and playback

  - User-defined storage structure
releaseNotes: >-
  Novità v3.0.3:
    - Editing mobile non distruttivo, workflow sperimentali, pagina "Aggiunti di recente" e controlli d'integrità della libreria.
    - Backup in background più affidabile, slideshow mobile, OCR mobile, upload diretto negli album e scelta della dimensione durante la condivisione.
    - Anteprima di transcoding video HLS in tempo reale e nuovo lettore video web.
    - Corrette ulteriori anomalie di upload delle Live Photo, visibilità e stabilità.
    - ⚠️ È una major release: verifica la compatibilità delle app mobili e degli strumenti di terze parti che usano l'API.
