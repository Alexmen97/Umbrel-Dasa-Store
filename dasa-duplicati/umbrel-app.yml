  - https://i.imgur.com/5usxk3K.png
releaseNotes: >-
  Novità v2.3.0.4:
    - Filtri applicati lato server: i percorsi esclusi non vengono più letti e i log non espongono percorsi sensibili.
    - Maggiore stabilità: corretti un leak di memoria per Foto di macOS, una race condition dell'Agent e crash causati da errori di metadati.
    - Nuovo timeout di autenticazione del backend, retry HTTP più affidabile e miglioramenti per MSSQL, S3 lock mode e provider di segreti.
    - Aggiornato rclone nell'immagine Docker.
dependencies: []
