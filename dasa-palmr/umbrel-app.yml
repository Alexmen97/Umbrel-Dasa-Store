id: dasa-palmr
name: Palmr
tagline: A private alternative to WeTransfer
icon: https://i.imgur.com/dpOBOQJ.png
category: files & productivity
version: "3.3.2-beta"
port: 5487
description: >-
  ✨ Novità in v3.3.2-beta: upload S3 di file molto grandi e download Firefox più affidabili, anteprime dietro proxy corrette e aggiornamento di sicurezza di Next.js.


  🌴 Palmr is an open source file sharing platform that gives you full control over your uploads and downloads. It is designed for secure and private transfers without relying on third party services.


  With a clean and modern interface, Palmr makes it easy to send and receive files of any size, limited only by your available storage. The app is lightweight, fast, and easy to use, built with technologies like Fastify, Next.js, and SQLite for optimal performance.


  It supports features like password protection, user authentication, customizable branding, and optional single sign on through OpenID Connect. Palmr is ideal for anyone who wants a simple yet powerful file sharing tool that runs directly on their Umbrel server.
