description: >-
  OpenSpeedTest™ è uno speed test di rete HTML5 open source e privo di plugin, che non richiede Flash o Java.


  Permette di testare le prestazioni reali della tua rete locale (LAN / Wi-Fi) o della connessione Internet direttamente dal browser di qualsiasi dispositivo (computer, smartphone, tablet, smart TV, console) senza installare alcuna applicazione client.


  ### Funzionalità principali:

  - **100% HTML5 & JavaScript**: funziona su qualsiasi browser moderno senza estensioni o plugin.

  - **Test LAN ad altissima velocità**: supporta velocità da 1 Kbps fino a oltre 10 Gbps per diagnosticare colli di bottiglia locali.

  - **Diagnostica completa**: misura velocità di download, upload, ping e jitter in tempo reale.

  - **Leggero ed efficiente**: servito tramite web server NGINX ottimizzato, con consumo minimo di risorse su qualsiasi hardware.

  - **Nessuna telemetria né tracciamento**: i test e i relativi dati restano interamente privati all'interno del tuo server Umbrel.
