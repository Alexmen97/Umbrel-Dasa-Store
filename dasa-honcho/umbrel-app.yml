name: Honcho
tagline: AI-native user modeling, conclusion extraction, and cross-session memory
icon: https://i.imgur.com/xezpkIp.png
category: ai
version: "3.2.2"
port: 8000
description: >-
  🧠 Honcho è un server di memoria avanzato e nativo per l'Intelligenza Artificiale, progettato specificamente per agenti conversazionali e assistenti complessi.


  A differenza dei tradizionali database vettoriali o dei semplici file di memoria statica, Honcho osserva le conversazioni multi-turno, modella continuamente la psicologia e le preferenze dell'utente, ed estrae conclusioni dichiarative e fatti ad alto livello attraverso processi di background asincroni (deriver workers).


  Caratteristiche principali:


  👤 Continual User Modeling: Analizza le interazioni nel tempo per costruire un profilo cognitivo e comportamentale evoluto sia dell'utente che dell'assistente.


  💡 Automated Conclusion Extraction: Distilla automaticamente la cronologia della chat in fatti, credenze e preferenze stabili.


  🔍 Ricerca Ibrida Semantica e Relazionale: Basato su PostgreSQL 15 con pgvector e cache Redis ad alte prestazioni.


  ⚡ Stack Diretto e Leggero: Senza dashboard esterne superflue; espone direttamente le API FastAPI native con documentazione interattiva Swagger UI accessibile su /docs.


  📖 Guida Rapida alla Configurazione:


  1. Da Umbrel, fai clic destro su Honcho → Impostazioni → Avanzate → Variabili d'ambiente → Aggiungi variabile personalizzata.


  2. Per OpenAI, inserisci LLM_OPENAI_API_KEY nel servizio api e poi nello stesso modo nel servizio deriver.


  3. Per provider come Anthropic, Gemini o endpoint locali OpenAI-compatibili (Ollama, vLLM), consulta la guida completa e dettagliata nel README del repository.
