releaseNotes: >-
  Novità 0.13.4:
    - Apre note, canali e pagine workspace come schede affiancate alle chat.
    - Aggiunge bacheche cartelle, stati chat, tag colorati e automazioni cartelle.
    - Mantiene i messaggi in coda sul server per permettere di lasciare la pagina durante le risposte.
    - Aggiunge visualizzazioni interattive opzionali e generazione video.
    - Migliora risposte lunghe, anteprime PDF grandi e caricamento cartelle.
    - Integrazione nativa con Ollama tramite variabile $APP_OLLAMA_URL e storage umbrelOS dataRoot.
    - Note upstream: https://github.com/open-webui/open-webui/releases/tag/v0.13.4
