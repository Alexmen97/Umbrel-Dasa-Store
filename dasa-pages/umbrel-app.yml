category: developer tools
version: "0.1.2"
port: 8377
description: >-
  Pages trasforma il tuo Umbrel in una piattaforma privata, intuitiva ed elegante per creare, ospitare e pubblicare siti web statici.


  Permette di avviare un nuovo sito scegliendo tra 9 template responsive professionali, importare progetti già esistenti come archivi ZIP o creare pagine da zero modificando file HTML, CSS, JavaScript, JSON e Markdown direttamente dal browser con anteprima live integrata.


  ### Funzionalità principali:

  - **Dashboard centralizzata**: organizza siti multipli con gestione separata per bozze e siti pubblicati.

  - **Editor & File Manager**: editor di codice integrato nel browser con anteprima istantanea, caricamento drag & drop di file, cartelle e archivi ZIP.

  - **Libreria template inclusa**: 9 template responsive di partenza (portfolio, blog, landing page, documentazione, profili Nostr), leggeri e privi di dipendenze esterne.

  - **Opzioni di condivisione avanzate**: pubblicazione su rete locale (LAN), dominio personalizzato, servizio Tor Onion condiviso di Umbrel oppure indirizzo Onion v3 dedicato e indipendente per ciascun singolo sito.

  - **Backup & Esportazione**: export rapido in archivio ZIP e backup locali completi e ripristinabili.

  - **Privacy e controllo totale**: contatore visite integrato senza tracciamento o cookie di terze parti, controlli CORS, SPA fallback e cache personalizzabile. Nessun dato inviato al cloud.


  ⚙️ L'accesso Tor remoto deve essere abilitato nelle impostazioni di Umbrel se desideri utilizzare anche l'indirizzo Onion condiviso di sistema.
