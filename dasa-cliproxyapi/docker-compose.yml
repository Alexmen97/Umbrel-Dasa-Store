version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-cliproxyapi_server_1
      APP_PORT: 8317
      PROXY_AUTH_ADD: "false"

  server:
    image: eceasy/cli-proxy-api:v8.0.77@sha256:2acf44fbadf9933a04e971048b4c2ddd184ce6e3ea08fc2dc25354f3a365f5ab
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/data/config.yaml"]
    environment:
      - TZ=Europe/Rome
      - MANAGEMENT_STATIC_PATH=/CLIProxyAPI/data/static
    volumes:
      - ${APP_DATA_DIR}/data:/CLIProxyAPI/data
    restart: on-failure
