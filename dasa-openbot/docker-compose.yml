version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-openbot_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/nightly-labs/openbot:0.72.0@sha256:516e7cf80e606c8437b6f363c1eb7c399ca20a8cae157237cc0c941246c61db7
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - apparmor:unconfined
      - no-new-privileges:true
    shm_size: 2gb
    mem_limit: 8g
    stop_grace_period: 60s
    volumes:
      - ${APP_DATA_DIR}/data/openbot:/data
    environment:
      OPENBOT_SETUP_PAGE_PORT: "8080"
