manifestVersion: 1
id: dasa-openbot
name: OpenBot Server
tagline: Agenti AI persistenti sul tuo server
icon: https://raw.githubusercontent.com/Alexmen97/Umbrel-Dasa-Store/master/dasa-openbot/icon.png
category: ai
version: "0.72.0"
port: 8787
description: >-
  OpenBot Server esegue agenti AI persistenti con workspace, conversazioni,
  strumenti e automazioni sul tuo Umbrel. Supporta diversi provider e servizi
  compatibili OpenAI.


  Dalla versione 0.72.0 l'app include la schermata di configurazione guidata:
  al primo avvio, aprendo l'icona da Umbrel potrai inserire la tua email e il
  codice monouso direttamente dal browser per collegare il server al tuo account.
  Successivamente potrai accedere e gestire gli agenti dall'app desktop, dall'app
  iPhone o da https://openbot.run/app con lo stesso account.


  DEVELOPMENT PREVIEW: gli agenti eseguono comandi, modificano i dati e
  accedono alla rete senza conferme per ogni azione. Non montare il socket
  Docker o cartelle sensibili. Il container non isola automaticamente la LAN.
  Limite RAM del server: 8 GB; memoria condivisa: 2 GB.


  Tutti i dati, credenziali e keyring sono persistenti. Esegui backup a server
  fermo dell'intera cartella data/openbot. Aggiornamenti gestiti dallo store.
  Licenza PolyForm Noncommercial 1.0.0: non destinato a usi commerciali senza
  autorizzazione. Consulta README e licenza prima dell'uso.
developer: Nightly Labs / Synthetify Labs
website: https://openbot.run
submitter: dasa
submission: https://github.com/Alexmen97/Umbrel-Dasa-Store
repo: https://github.com/nightly-labs/openbot
support: https://github.com/nightly-labs/openbot/issues
gallery:
  - https://raw.githubusercontent.com/Alexmen97/Umbrel-Dasa-Store/master/dasa-openbot/1.png
  - https://raw.githubusercontent.com/Alexmen97/Umbrel-Dasa-Store/master/dasa-openbot/2.png
  - https://raw.githubusercontent.com/Alexmen97/Umbrel-Dasa-Store/master/dasa-openbot/3.png
  - https://raw.githubusercontent.com/Alexmen97/Umbrel-Dasa-Store/master/dasa-openbot/4.png
releaseNotes: >-
  Aggiornato OpenBot Server alla versione 0.72.0. Novità principali: introdotta
  la schermata di configurazione iniziale guidata direttamente da browser (senza
  più necessità del terminale per il login con codice email), rimozione del
  container web di appoggio, irrobustito il cambio automatico e fallback dei
  modelli, migliorata la stabilità delle sessioni lunghe e ottimizzata la gestione
  della memoria per gli agenti persistenti.
dependencies: []
