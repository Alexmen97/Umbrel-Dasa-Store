version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-omniroute_server_1
      APP_PORT: 20128
      PROXY_AUTH_ADD: "false"

  server:
    image: diegosouzapw/omniroute:3.8.54@sha256:2c4c755a54f8ce5341bc1856580b71f47a0f16a9afab4a55f84d540810631f68
    environment:
      - NODE_ENV=production
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20128
      - API_HOST=0.0.0.0
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    restart: on-failure
