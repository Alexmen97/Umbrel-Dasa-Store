manifestVersion: 1.1
id: dasa-immich
category: files & productivity
name: Immich
version: "v3.3.3"
tagline: High-performance photo and video backup solution
icon: https://i.imgur.com/wqT5bDn.png
description: >-
  ✨ Novità in v3.3.3: Aggiornamento sincronizzato di server e machine learning; migliorate prestazioni della pagina Esplora e date dei ricordi.


  An open-source and high-performance self-hosted backup solution for the videos and photos on your mobile device


  ⚠️ Immich is under very active development. Expect bugs and changes. Do not use it as the only way to store your photos and videos!


  Features:

  - Upload and view videos and photos

  - Auto backup when the app is opened

  - Selective album(s) for backup

  - Download photos and videos to a local device

  - Multi-user support

  - Album and Shared albums

  - Scrubbable/draggable scrollbar

  - Support RAW (HEIC, HEIF, DNG, Apple ProRaw)

  - Metadata view (EXIF, map)

  - Search by metadata, objects and image tags

  - Administrative functions (user management)

  - Background backup

  - Virtual scroll

  - OAuth support

  - LivePhoto backup and playback

  - User-defined storage structure
releaseNotes: >-
  Novità v3.3.3:
    - Aggiornati insieme server e machine learning alla versione v3.3.3.
    - Migliorate le prestazioni delle query sulle persone e della pagina Esplora.
    - Corrette le date dei ricordi nell’app mobile nelle diverse lingue.
    - Le release intermedie aggiungono condivisione delle persone, nuovi modelli OCR e ricerca rinnovata.
    - Eseguire un backup di database e libreria prima dell’aggiornamento e verificare la compatibilità dell’app mobile e delle integrazioni API.
    - Note upstream: https://github.com/immich-app/immich/releases/tag/v3.3.3
