version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-openbot_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/nightly-labs/openbot:0.74.0@sha256:696a6737686c989d07881a18de759e6615d5476fe081b7a56dfbb7e929336c28
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - apparmor:unconfined
      - no-new-privileges:true
    shm_size: 2gb
    mem_limit: 8g
    stop_grace_period: 60s
    volumes:
      - ${APP_DATA_DIR}/data/openbot:/data
    environment:
      OPENBOT_SETUP_PAGE_PORT: "8080"
