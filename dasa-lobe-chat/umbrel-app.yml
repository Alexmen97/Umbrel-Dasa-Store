releaseNotes: >-
  Novità v2.3.3:
    - Passaggio all'architettura v2 multi-container con PostgreSQL (ParadeDB pg17), Redis 7, S3 RustFS e motore di ricerca SearXNG.
    - Canali diretti e regole di risposta per singolo agente.
    - Profili d'identità per agenti.
    - Creazione di progetti da repository GitHub e collegamento task-to-project.
    - Migliorato ordinamento e gestione della knowledge base.
    - Corretti callback per workflow non autenticati e aumentata l'affidabilità della chat.
    - Note upstream: https://github.com/lobehub/lobehub/releases/tag/v2.3.3
