releaseNotes: >-
  Updated to the official Honcho Docker image v3.2.2 for both the API and deriver.


  Database provisioning and migrations now run before the API starts. Health checks ensure PostgreSQL, Redis, and the API are ready before dependent services start.


  This is a major upgrade from v2.0.3. Back up your Honcho PostgreSQL data before updating, and verify compatibility with your clients and integrations. Configure your own LLM and embedding provider credentials using the Honcho v3 configuration reference; no private endpoints or API keys are included.
