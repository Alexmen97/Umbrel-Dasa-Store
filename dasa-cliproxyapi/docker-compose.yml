version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-cliproxyapi_server_1
      APP_PORT: 8317
      PROXY_AUTH_ADD: "false"

  server:
    image: eceasy/cli-proxy-api:v8.0.79@sha256:ce02dd2ba9186024762d8b6525c068c5a5fab78435b8d82d9c03f7ce74feeb5b
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/data/config.yaml"]
    environment:
      - TZ=Europe/Rome
      - MANAGEMENT_STATIC_PATH=/CLIProxyAPI/data/static
    volumes:
      - ${APP_DATA_DIR}/data:/CLIProxyAPI/data
    restart: on-failure
