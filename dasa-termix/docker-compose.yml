version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-termix_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/termix-ssh/termix:26.10.2@sha256:9a30ecec2f4fe471c496472cd91e6cd8bb99845eb2489e645991bbe165dd5d9b
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      GUACD_HOST: guacd
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    restart: on-failure
