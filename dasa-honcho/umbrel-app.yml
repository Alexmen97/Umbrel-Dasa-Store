name: Honcho
tagline: Server di memoria cognitiva AI con dashboard web interattiva, user modeling e inferenza dialettica
icon: https://i.imgur.com/xezpkIp.png
category: ai
version: "3.2.2-5"
port: 8000
description: >-
  🧠 Honcho è un server di memoria cognitiva nativo per l'Intelligenza Artificiale, progettato per agenti autonomi, assistenti intelligenti e architetture multi-agente.


  A differenza dei comuni database vettoriali o delle memorie statiche a file, Honcho va oltre il semplice recupero: analizza le conversazioni su più sessioni, modella continuamente la psicologia e le preferenze dell'utente ed estrae fatti stabili e deduzioni logiche tramite processi di background asincroni (deriver workers).


  🖥️ Nuova Dashboard Web Integrata:


  Questo pacchetto include l'interfaccia grafica completa, moderna e dark-first, accessibile direttamente cliccando sull'app:


  • 🗂️ Workspace & Session Explorer: visualizzazione in tempo reale di sessioni, metadati e timeline dei messaggi con conteggio token.


  • 👤 Cognitive Peer Cards: profili cognitivi sintetizzati, tratti comportamentali e preferenze operative dell'utente.


  • 🔍 Memoria & Ricerca Vettoriale: consultazione strutturata dei fatti dedotti con filtri per livello cognitivo (explicit, deductive, inductive) e query semantica vettoriale Cosine.


  • 💬 Dialectic Chat Playground: console interattiva di inferenza con regolazione del livello di reasoning (minimal, low, medium, high, max), streaming SSE in tempo reale e tracciamento trasparente delle evidenze consultate dall'LLM prima di rispondere.


  • 📚 Documentazione API Swagger: sempre a disposizione all'indirizzo /docs.


  ⚡ Stack Tecnologico Unificato:


  Include FastAPI v3.2.2, PostgreSQL 15 con estensione vettoriale pgvector HNSW, cache Redis, Deriver asincrono e Gateway Node.js Same-Origin.


  📖 Configurazione Rapida LLM ed Embedding:


  1. Da Umbrel, fai clic con il tasto destro su Honcho → Impostazioni → Avanzate → Variabili d'ambiente.


  2. Per gli LLM (OpenAI o CliproxyAPI): imposta LLM_OPENAI_API_KEY e LLM_OPENAI_BASE_URL nei servizi api e deriver.


  3. Per gli Embedding locali: configura Ollama locale (es. nomic-embed-text a 768 dimensioni) per generare vettori ad alta velocità sulla tua rete LAN.
