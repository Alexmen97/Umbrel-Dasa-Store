description: >-
  Dokploy è una piattaforma open source avanzata per il deployment, il routing e la gestione del ciclo di vita di applicazioni web, microservizi e database su architettura Docker e Docker Swarm.


  Fornisce una dashboard completa e intuitiva per rilasciare progetti in pochi click, configurare domini con certificati SSL automatici gestiti da Traefik, impostare variabili d'ambiente cifrate a riposo (AES-256-GCM) e monitorare CPU, memoria e log in tempo reale.


  ### Funzionalità principali:

  - **Routing con Traefik v3 integrato**: reverse proxy ad alte prestazioni con porte dedicate 8529 (HTTP) e 8530 (HTTPS/HTTP3).

  - **Deploy da Git & Docker**: integrazione con repository GitHub, GitLab, Bitbucket, Gitea e Docker Registry privati con webhook continui.

  - **Database pronti all'uso**: provisioning istantaneo di PostgreSQL, MySQL, MariaDB, MongoDB e Redis con backup e ripristino pianificabili.

  - **Docker Swarm & Overlay Network**: sfrutta la rete overlay isolata `dokploy-network` per garantire comunicazione sicura tra i container.

  - **Monitoraggio e diagnostica live**: grafici di utilizzo risorse, stream di log e terminale web interattivo per ciascun container.

  - **Sicurezza avanzata**: cifratura AES-256-GCM per tutte le variabili d'ambiente e autenticazione a due fattori (2FA).


  ⚠️ Dokploy gestisce il routing delle applicazioni distribuite tramite le porte 8529 (HTTP) e 8530 (HTTPS).
