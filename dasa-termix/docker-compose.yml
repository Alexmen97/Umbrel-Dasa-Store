version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-termix_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/termix-ssh/termix:26.11.1@sha256:cac04fdc9cd38c98566e6e903ad77a3a85b62869e6b78ada35e1570cbc32c6cb
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      GUACD_HOST: guacd
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    restart: on-failure
