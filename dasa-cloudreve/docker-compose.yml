version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: dasa-cloudreve_web_1
      APP_PORT: 5212

  web:
    image: cloudreve/cloudreve:4.18.0@sha256:f7a464100bf6325e9ba58cb2b0ee60f9a24c58fc2eb90647720bc4b8f3cddd9a
    restart: on-failure
    environment:
      CR_CONF_Database.Type: postgres
      CR_CONF_Database.Host: db
      CR_CONF_Database.User: cloudreve
      POSTGRES_HOST_AUTH_METHOD: trust
      CR_CONF_Database.Name: cloudreve
      CR_CONF_Database.Port: 5432
      CR_CONF_Redis.Server: redis:6379
      CR_CONF_HTTP.Port: 5212
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5212 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ${APP_DATA_DIR}/data/cloudreve_data:/cloudreve/data:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17.10@sha256:39fb82e41109483c81ac15422a302500b4a753777b47f8431038703536bc6c52
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "cloudreve", "-U", "cloudreve"]
      timeout: 45s
      interval: 10s
      retries: 10
    volumes:
      - ${APP_DATA_DIR}/data/postgres_data:/var/lib/postgresql/data:rw
    environment:
      POSTGRES_DB: cloudreve
      POSTGRES_USER: cloudreve
      POSTGRES_HOST_AUTH_METHOD: trust

  redis:
    image: redis:8.6.4@sha256:a051e4f48a5d0ceda6554974f3ad0f5369f4479197f36829332c1325cecad2b7
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
    volumes:
      - ${APP_DATA_DIR}/data/redis_data:/data:rw
    environment:
      TZ: Europe/Rome
