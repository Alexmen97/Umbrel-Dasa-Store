category: files & productivity
version: "0.2.0"
port: 8397
description: >-
  OnionDrop è un servizio self-hosted sicuro per la ricezione anonima e cifrata di file e messaggi, basato sul motore ufficiale di OnionShare e sulla rete Tor.


  Permette di creare inbox `.onion` persistenti e raggiungibili tramite Tor Browser. Chiunque possieda l'indirizzo (o la chiave di autorizzazione privata opzionale) può inviarti documenti, immagini, archivi o messaggi di testo senza creare account, senza rivelare il proprio indirizzo IP e senza passare da server cloud di terze parti.


  ### Funzionalità principali:

  - **Inbox Tor persistenti**: mantengono lo stesso indirizzo `.onion` anche dopo il riavvio del container o di Umbrel.

  - **Massima privacy**: ricezione anonima diretta sul tuo disco locale, senza intermediari né telemetria.

  - **Controllo degli accessi**: supporto per inbox pubbliche o protette da chiavi di autorizzazione Tor Client.

  - **Anteprima file integrata**: visualizzazione sicura e in sola lettura per documenti (PDF, DOCX, ODT), fogli di calcolo, immagini, audio, video e archivi compressi.

  - **Download cumulativo**: selezione multipla dei file ricevuti con download immediato in un singolo archivio ZIP.

  - **Integrità garantita**: calcolo automatico dei checksum SHA-256 su tutti i file caricati.

  - **Codici QR**: visualizzazione e download di QR code per condividere rapidamente il link di invio.

  - **Multilingua**: interfaccia localizzata in 8 lingue, compreso l'italiano.
developer: Denny Subke
