releaseNotes: >-
  Novità v0.2.0:
    - Applicazione containerizzata indipendente basata su OnionShare CLI 2.6.4.
    - Supporto per 8 lingue con rilevamento e selezione automatica.
    - Stato animato della connessione e bootstrap Tor in tempo reale.
    - Checksum SHA-256 e download multiplo di file in archivio ZIP.
    - Supporto multi-architettura nativo (linux/amd64 e linux/arm64).
