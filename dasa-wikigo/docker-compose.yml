version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: dasa-wikigo_web_1
      APP_PORT: 8080

  web:
    image: leomoonstudios/wiki-go:1.9.6@sha256:642fe29fcedbaede3bacc58aba7e3070bf554990ff57143ed0b77edaf5d26d9e
    security_opt:
      - no-new-privileges:true
    user: 1000:1000
    restart: on-failure
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ${APP_DATA_DIR}/data:/wiki/data:rw
    environment:
       PUID: 1000
       PGID: 1000
