version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-omniroute_server_1
      APP_PORT: 20128
      PROXY_AUTH_ADD: "false"

  server:
    image: diegosouzapw/omniroute:3.8.53@sha256:b52a17661a1aff42ffb78f349f423e986dfc55b57274f28559f8387622ef8ee4
    environment:
      - NODE_ENV=production
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20128
      - API_HOST=0.0.0.0
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    restart: on-failure
