releaseNotes: >-
  Aggiornato OpenBot alla 0.51.1 (incluse novità 0.51.0). Supporto nativo
  ai provider OpenRouter e DeepSeek con scelta del reasoning level alla
  creazione agente. Ripresa automatica post-limite d'uso e monitoraggio costi
  OpenCode. Skill globali esposte da ~/.agents/skills per tutti i provider.
  Nuove app Apple e Supabase a catalogo, page rail laterale e apertura link
  nel browser preferito. Fix crash handler AppImage, stabilità Gemini su LXCFS,
  limite CPU per Claude e download automatico Pi CLI. Mantenuti limite RAM
  di 8 GB, memoria condivisa di 2 GB e dati persistenti.
