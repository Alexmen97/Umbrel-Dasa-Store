releaseNotes: >-
  Novità 2.3.0:
    - Nuovi webhooks, libreria multimediale ed email transazionali; pagamenti capture/refund unificati.
    - ATTENZIONE: vengono eseguite automaticamente 6 migrazioni al primo avvio, con rinomina delle colonne indirizzo. Eseguire un backup completo del database prima dell’aggiornamento; per tornare alla versione precedente ripristinare il backup.
    - Riconfigurare i webhook Stripe e PayPal secondo le istruzioni upstream; controllare zone di spedizione e paesi di vendita.
    - Temi, estensioni e integrazioni che usano colonne indirizzo o API pagamento precedenti devono essere adattati.
    - Le nuove installazioni non includono più il catalogo di esempio.
    - Note upstream: https://github.com/evershopcommerce/evershop/releases/tag/v2.3.0
