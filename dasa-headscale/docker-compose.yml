version: '3.7'
services:

  app_proxy:
    depends_on:
      - traefik
    environment:
      APP_HOST: dasa-headscale_traefik_1
      APP_PORT: 80
      PROXY_AUTH_ADD: 'false'

  headscale:
    # https://github.com/juanfont/headscale/pkgs/container/headscale/versions
    image: >-
      ghcr.io/juanfont/headscale:0.29.2@sha256:d337f1be4a9155b330aa9077bf6c82d24ff0581b8e69390ebc6d7c623bb339ce
    volumes:
      - '${APP_DATA_DIR}/config:/etc/headscale'
      - '${APP_DATA_DIR}/lib:/var/lib/headscale'
      - '${APP_DATA_DIR}/run:/var/run/headscale'
    command: serve
    restart: on-failure
    labels:
      - traefik.enable=true
      - >-
        traefik.http.routers.headscale-rtr.rule=Host(`${UMBREL_HOST}`) &&
        PathPrefix(`/`)
      - traefik.http.services.headscale-svc.loadbalancer.server.port=8080

  headscale_ui:
    depends_on:
      - headscale
    # https://github.com/gurucomputing/headscale-ui/pkgs/container/headscale-ui/versions
    image: >-
      ghcr.io/gurucomputing/headscale-ui:2026.03.17@sha256:015f5ba04bcbd5ee03178540a1dbbfc97b6896d7411032e3bf33c2f3e08f8b6f
    restart: on-failure
    labels:
      - traefik.enable=true
      - >-
        traefik.http.routers.headscale-ui-rtr.rule=Host(`${UMBREL_HOST}`) &&
        PathPrefix(`/web`)
      - traefik.http.services.headscale-ui-svc.loadbalancer.server.port=8080

  headscale_admin:
    depends_on:
      - headscale
    # https://hub.docker.com/r/goodieshq/headscale-admin/tags
    image: >-
      goodieshq/headscale-admin:v0.27.0@sha256:e579fce717aa9b52d8a4a17e7624ef8e2f0352b90da333615ffd1eccd9e34bf5
    restart: on-failure
    labels:
      - traefik.enable=true
      - >-
        traefik.http.routers.headscale-admin-rtr.rule=Host(`${UMBREL_HOST}`) &&
        PathPrefix(`/admin`)
      - traefik.http.services.headscale-admin-svc.loadbalancer.server.port=80

  traefik:
    # https://hub.docker.com/_/traefik/tags
    image: >-
      traefik:v3.7.8@sha256:5cb000ad823bfcfff911e22a4c4fa09cee74c7a2d960c012a1a46a8d0a159fcf
    restart: on-failure
    command:
      - '--api.insecure=true'
      - '--providers.docker'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--global.sendAnonymousUsage=false'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
