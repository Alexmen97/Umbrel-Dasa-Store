version: "v8.0.79"
tagline: AI API proxy & gateway for Antigravity, Claude Code, Codex, Gemini, Grok, and Devin
icon: https://raw.githubusercontent.com/Alexmen97/Umbrel-Dasa-Store/master/dasa-cliproxyapi/icon.png
description: >-
  🤖 CLIProxyAPI incapsula Antigravity, ChatGPT Codex, Claude Code, Grok Build, Muse Code e Devin in un servizio API compatibile con OpenAI, Anthropic Claude, Google Gemini e Codex.


  Ti consente di utilizzare modelli AI leader (Gemini, Claude, GPT, Grok) tramite una singola interfaccia API unificata, senza configurazioni complesse.


  Caratteristiche principali:

  - Interfaccia Web di Gestione (Management Center) inclusa su /management.html

  - API compatibili con OpenAI (/v1/chat/completions), Anthropic (/v1/messages) e Google Gemini (/v1beta/models)

  - Gestione credenziali e autenticazione OAuth multi-provider

  - Supporto per streaming (SSE), input multimodale (testo, immagini, file) e chiamate di funzione (tool calling)

  - Monitoraggio live delle richieste, latenza, TTFT e token usage

  - Architettura resiliente in Go con retry automatici e failover


  🔑 Password predefinita per il Management Center: umbrel
releaseNotes: >-
