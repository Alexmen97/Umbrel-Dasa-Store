releaseNotes: >-
  Novità v3.3.2-beta:
    - Corretti upload S3 compatibili di file oltre 10 GB e download di file grandi su Firefox.
    - Aggiornamento immediato del file manager dopo creazione o rinomina di cartelle e correzioni delle condivisioni inverse con file oltre 100 MB.
    - Anteprime audio/video più affidabili dietro reverse proxy.
    - Next.js aggiornato per correggere la vulnerabilità CVE-2025-51605.
