version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-openbot_web_1
      APP_PORT: 8080

  server:
    image: ghcr.io/nightly-labs/openbot:0.54.0@sha256:46d86c48efdece9f0aae2338e96f6bfe01fa8c7c3a49075ce0fe42d362683039
    restart: on-failure
    user: "1000:1000"
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - apparmor:unconfined
      - no-new-privileges:true
    shm_size: 2gb
    mem_limit: 8g
    stop_grace_period: 60s
    volumes:
      - ${APP_DATA_DIR}/data/openbot:/data

  web:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    restart: on-failure
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    volumes:
      - ${APP_DATA_DIR}/www:/www:ro
