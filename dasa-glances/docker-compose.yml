version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-glances_web_1
      APP_PORT: 61208
      PROXY_AUTH_ADD: "false"

  web:
    image: nicolargo/glances:4.5.9@sha256:1d994d181732cfbf68b7c5826a1f71b89624e3eaaa2fe28b28048b2f61b200d7
    environment:
      - TZ=Europe/Rome
      - GLANCES_OPT=-w
    pid: host
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
