version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-glances_web_1
      APP_PORT: 61208
      PROXY_AUTH_ADD: "false"

  web:
    image: nicolargo/glances:4.5.8@sha256:32ccbc559baa624bd41419c9a1daf2c32b391dfbee106434186a52bccd164ac7
    environment:
      - TZ=Europe/Rome
      - GLANCES_OPT=-w
    pid: host
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
