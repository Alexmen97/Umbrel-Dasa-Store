manifestVersion: 1.1
id: dasa-immich
storage:
  dataRoot: data
folderAccess:
  - id: external-library
    name: External Library
    note: Select a folder containing photos or videos, then configure /mnt/external-library as an import path for an External Library in Immich. Access is read-only to protect the original files.
    mounts:
      - service: server
        targetPath: /mnt/external-library
        readOnly: true
category: files & productivity
name: Immich
version: "v3.4.1"
tagline: High-performance photo and video backup solution
icon: https://i.imgur.com/wqT5bDn.png
description: >-
  ✨ Novità in v3.4.1: Correzioni di stabilità e prestazioni, risolto rallentamento con link condivisi e supporto HEIF esteso.


  An open-source and high-performance self-hosted backup solution for the videos and photos on your mobile device


  ⚠️ Immich is under very active development. Expect bugs and changes. Do not use it as the only way to store your photos and videos!


  Features:

  - Upload and view videos and photos

  - Auto backup when the app is opened

  - Selective album(s) for backup

  - Download photos and videos to a local device

  - Multi-user support

  - Album and Shared albums

  - Scrubbable/draggable scrollbar

  - Support RAW (HEIC, HEIF, DNG, Apple ProRaw)

  - Metadata view (EXIF, map)

  - Search by metadata, objects and image tags

  - Administrative functions (user management)

  - Background backup

  - Virtual scroll

  - OAuth support

  - LivePhoto backup and playback

  - User-defined storage structure
releaseNotes: >-
  Novità v3.4.1 (allineamento umbrelOS):
    - Introdotto supporto folderAccess per External Library: monta foto/video in sola lettura da /mnt/external-library.
    - Abilitato supporto hardware GPU per trascodifica e machine learning (permissions: GPU).
    - Abilitata gestione avanzata dello storage umbrelOS (storage: dataRoot: data).
    - Aggiornata revisione modello machine learning (MACHINE_LEARNING_MODEL_REVISION: v2).
    - Aggiornato hook pre-start per compatibilità APP_DATA_ROOT e app ID dasa-immich.
    - Note upstream: https://github.com/immich-app/immich/releases/tag/v3.4.1
developer: Alex Tran
website: https://www.immich.app
dependencies: []
repo: https://github.com/immich-app/immich
support: https://github.com/immich-app/immich/discussions
port: 2283
gallery:
  - https://i.imgur.com/DMdKKcy.png
  - https://i.imgur.com/wnSAl9v.png
  - https://i.imgur.com/yTYnfVD.png
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - GPU
submitter: dasa
submission: https://github.com/getumbrel/umbrel-apps/pull/239
