version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: dasa-honcho_dashboard_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: 'false'

  dashboard:
    image: ghcr.io/alexmen97/honcho-dashboard:1.2.0
    restart: on-failure
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - EXTERNAL_PORT=8000
      - ALLOWED_HOSTS=127.0.0.1,localhost,::1,192.168.4.91,umbrel.local,dasa-honcho_dashboard_1,app_proxy
      - TRUSTED_ORIGINS=http://127.0.0.1:8000,http://localhost:8000,http://192.168.4.91:8000,http://umbrel.local:8000
      - HONCHO_TARGET_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  api:
    entrypoint: ["sh", "-c", "/app/.venv/bin/python scripts/provision_db.py && /app/.venv/bin/python scripts/configure_embeddings.py --yes && exec /app/.venv/bin/fastapi run --host 0.0.0.0 --workers $${API_WORKERS:-1} src/main.py"]
    image: ghcr.io/plastic-labs/honcho:v3.2.2@sha256:c74955d6dbea6dda42c2dd9dd13dea726fcba36ba5c0b6bae4867f7ed762896d
    restart: on-failure
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://honcho:honchopassword@postgres:5432/honcho
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - AUTH_USE_AUTH=false
      - VECTOR_STORE_TYPE=pgvector
      # LLM endpoint
      - LLM_OPENAI_BASE_URL=https://tuo_endpoint/v1
      # Model mapping
      - DERIVER_MODEL_CONFIG__TRANSPORT=openai
      - DERIVER_MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - SUMMARY_MODEL_CONFIG__TRANSPORT=openai
      - SUMMARY_MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DIALECTIC_LEVELS__LOW__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__LOW__MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DIALECTIC_LEVELS__MAX__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__MAX__MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT=openai
      - DREAM_DEDUCTION_MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT=openai
      - DREAM_INDUCTION_MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      # Embedding via local Ollama
      - EMBEDDING_VECTOR_DIMENSIONS=768
      - EMBEDDING_MODEL_CONFIG__TRANSPORT=openai
      - EMBEDDING_MODEL_CONFIG__MODEL=nomic-embed-text
      - EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL=http://192.168.4.108:11434/v1
      - EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY=ollama
      - EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE=never
    volumes:
      - ${APP_DATA_DIR}/data/honcho:/app/data

  deriver:
    image: ghcr.io/plastic-labs/honcho:v3.2.2@sha256:c74955d6dbea6dda42c2dd9dd13dea726fcba36ba5c0b6bae4867f7ed762896d
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://honcho:honchopassword@postgres:5432/honcho
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      # LLM endpoint
      - LLM_OPENAI_BASE_URL=https://tuo_endpoint/v1
      # Model mapping
      - DERIVER_MODEL_CONFIG__TRANSPORT=openai
      - DERIVER_MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - SUMMARY_MODEL_CONFIG__TRANSPORT=openai
      - SUMMARY_MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DIALECTIC_LEVELS__LOW__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__LOW__MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DIALECTIC_LEVELS__MAX__MODEL_CONFIG__TRANSPORT=openai
      - DIALECTIC_LEVELS__MAX__MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT=openai
      - DREAM_DEDUCTION_MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      - DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT=openai
      - DREAM_INDUCTION_MODEL_CONFIG__MODEL=Gemini-3.8-Flash
      # Embedding via local Ollama
      - EMBEDDING_VECTOR_DIMENSIONS=768
      - EMBEDDING_MODEL_CONFIG__TRANSPORT=openai
      - EMBEDDING_MODEL_CONFIG__MODEL=nomic-embed-text
      - EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL=http://192.168.4.108:11434/v1
      - EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY=ollama
      - EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE=never
    volumes:
      - ${APP_DATA_DIR}/data/honcho:/app/data

  postgres:
    image: pgvector/pgvector:pg15
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: honcho
      POSTGRES_USER: honcho
      POSTGRES_PASSWORD: honchopassword
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
