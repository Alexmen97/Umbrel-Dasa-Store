version: "3.2.2-1"
port: 8000
description: >-
  Honcho is an open-source, AI-native memory server designed specifically for stateful AI agents.


  Includes OpenConcho, a web dashboard for browsing workspaces, peers, sessions, conclusions, and memory-aware chat. The dashboard is connected to the bundled Honcho API automatically. API clients can continue using the same address on port 8000; API documentation remains available at /docs.


  Unlike traditional vector databases or static memory files, Honcho continually learns about users over time by observing multi-turn conversations, deriving deep behavioral insights, extracting conclusions, and building evolving profiles for both the user and the agent.


  Key Features:


  🧠 Cross-Session State & Continuity: Maintains conversations and context indefinitely across session resets and channel switches.


  👤 Continual User Modeling: Automatically analyzes interactions to build structured profiles (preferences, communication styles, domain knowledge, and behavioral patterns).


  💡 Automated Conclusion Extraction: Asynchronously distills raw conversations into high-level declarative conclusions and facts via background deriver workers.


  🔍 Semantic & Relational Search: Built on top of PostgreSQL with pgvector for efficient hybrid retrieval over observations, conclusions, and messages.


  ⚡ Native Integration: Seamlessly integrates with OpenClaw via the official `@honcho-ai/openclaw-honcho` plugin or any OpenAI-compatible agent framework.
