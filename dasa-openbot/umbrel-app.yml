releaseNotes: >-
  Aggiornato OpenBot Server alla versione 0.74.0 (include v0.73 e v0.74):
    - Nuova interfaccia utente su SolidJS 2.0 reattiva con rendering accelerato.
    - Nuova modalità vocale push-to-talk nella Voice Pill e audio/video player integrato in chat.
    - Failover automatico potenziato su provider di backup per prevenire interruzioni.
    - Riavvio sicuro con attesa dei task attivi degli agenti.
    - Supporto esteso a Gemini, Claude e Vault con compilazione automatica su HTTP locale.
    - Note upstream: https://github.com/nightly-labs/openbot/releases/tag/v0.74.0
