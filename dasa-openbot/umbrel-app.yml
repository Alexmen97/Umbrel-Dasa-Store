releaseNotes: >-
  Aggiornato OpenBot alla 0.48.2. Passaggio automatico ai modelli di backup
  in caso di errore del provider e reset dei limiti Codex dalle impostazioni.
  Gli agenti possono usare una sessione browser propria e rispondere a
  domande e approvazioni nella vista browser. Canali: diagnosi dei problemi
  di instradamento e apertura dei link ai file. Routine: configurazione
  webhook guidata con evento di test firmato e segnalazione dei fallimenti.
  App mobile 1.4.1 con Marketplace, anteprima di documenti e chat più rapide.
  Mantenuti limite RAM di 8 GB, memoria condivisa di 2 GB e dati persistenti.
