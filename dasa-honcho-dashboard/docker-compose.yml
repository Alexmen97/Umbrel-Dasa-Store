version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: dasa-honcho-dashboard_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: 'false'

  web:
    image: ghcr.io/alexmen97/honcho-studio:1.0.0
    restart: on-failure
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - EXTERNAL_PORT=8001
      - ALLOWED_HOSTS=127.0.0.1,localhost,::1,192.168.4.91,umbrel.local,dasa-honcho-dashboard_web_1
      - TRUSTED_ORIGINS=http://127.0.0.1:8001,http://localhost:8001,http://192.168.4.91:8001,http://umbrel.local:8001
      - HONCHO_TARGET_URL=http://192.168.4.91:8000
