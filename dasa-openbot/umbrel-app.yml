releaseNotes: >-
  Aggiornato OpenBot alla versione 0.59.0. Introdotti i livelli di reasoning
  personalizzabili (none, minimal, ultra), supporto ai nuovi provider Kimi e
  Hermes Agent, integrazione workflow con trigger ed eventi Discord, failover
  automatico su modello di backup all'esaurimento quota Gemini, eliminazione
  diretta di agenti con code bloccate, supporto multi-account per app web e
  miglioramenti di stabilità al browser remoto. Limite RAM di 8 GB, memoria
  condivisa di 2 GB e persistenza totale dei dati invariati.
