name: OmniRoute
version: "3.8.54"
tagline: Smart AI gateway for multi-provider LLMs with routing, fallback, and load balancing
icon: https://raw.githubusercontent.com/Alexmen97/Umbrel-Dasa-Store/master/dasa-omniroute/icon.png
description: >-
  🌐 OmniRoute è un AI Gateway unificato che permette di instradare qualsiasi modello LLM attraverso un unico endpoint compatibile OpenAI e Anthropic Claude.


  Combina più provider contemporaneamente (OpenAI, Anthropic Claude, Google Gemini, Ollama, OpenRouter, Groq, Mistral, DeepSeek, Cerebras, Cohere e molti altri), offrendo failover automatico a costo zero, bilanciamento del carico, retry intelligenti e routing prioritario per minimizzare costi e latenze.


  Caratteristiche principali:

  - 🌐 Endpoint Unificato: compatibile con OpenAI (/v1/chat/completions), Anthropic (/v1/messages) e Google Gemini. Funziona immediatamente con Cursor, Cline, Claude Desktop, LibreChat, Open WebUI e qualsiasi client compatibile.

  - 🔀 Smart Routing & Model Combos: raggruppa più modelli sotto un singolo ID virtuale (es. fallback su modelli gratuiti o low-cost quando le quote sono esaurite).

  - 📊 Dashboard Keak CI UI Kit: nuova interfaccia moderna con monitoraggio in tempo reale di latenze (TTFT), tracking token, costi stimati e salute dei provider.

  - 👥 Teams & Budget: gestione quote, centri di costo e budget condivisi per chiavi API.

  - 🔑 Gestione Chiavi e Quote: crea chiavi API virtuali con budget e limitazioni d'uso per proteggere i tuoi account.

  - ⚡ Fast-Path Bifrost & Prompt Cache: routing ultra-rapido con supporto per prompt caching nativo Gemini e Anthropic.

  - 🛡️ Zero-Config & Resiliente: generazione automatica di chiavi e crittografia SQLite su storage persistente.

  - ⚡ Multi-Architettura: ottimizzato nativamente per linux/amd64 e linux/arm64.
