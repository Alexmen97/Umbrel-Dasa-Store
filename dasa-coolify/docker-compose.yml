version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dasa-coolify_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  # Coolify runs as UID 9999 and expects its persistent directories to be
  # writable only by that account. Umbrel initially creates package data as
  # UID/GID 1000, so this one-shot service prepares the directories before the
  # application and realtime services start.
  coolify-permissions:
    image: ghcr.io/coollabsio/coolify:4.7.6@sha256:95d25ed900d0f0cb6e621c3bade63efdf1df85ba5c63e76ae3c92beba1debb90
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p \
          /data/coolify/source \
          /data/coolify/ssh/keys \
          /data/coolify/ssh/mux \
          /data/coolify/applications \
          /data/coolify/databases \
          /data/coolify/services \
          /data/coolify/backups \
          /data/coolify/proxy/dynamic \
          /data/coolify/webhooks-during-maintenance \
          /data/coolify/sentinel
        chown 9999:root \
          /data/coolify \
          /data/coolify/source \
          /data/coolify/ssh \
          /data/coolify/ssh/keys \
          /data/coolify/ssh/mux \
          /data/coolify/applications \
          /data/coolify/databases \
          /data/coolify/services \
          /data/coolify/backups \
          /data/coolify/proxy \
          /data/coolify/proxy/dynamic \
          /data/coolify/webhooks-during-maintenance \
          /data/coolify/sentinel
        chmod 700 \
          /data/coolify \
          /data/coolify/source \
          /data/coolify/ssh \
          /data/coolify/ssh/keys \
          /data/coolify/ssh/mux \
          /data/coolify/applications \
          /data/coolify/databases \
          /data/coolify/services \
          /data/coolify/backups \
          /data/coolify/proxy \
          /data/coolify/proxy/dynamic \
          /data/coolify/webhooks-during-maintenance \
          /data/coolify/sentinel
    volumes:
      - ${APP_DATA_DIR}/data/coolify:/data/coolify

  # A dedicated Docker daemon for workloads deployed by Coolify. Coolify never
  # receives Umbrel's host Docker socket.
  coolify-docker:
    image: docker:28.0.4-dind@sha256:ddb0033088b4fab74881ade341a582e3c6c8021b82377703ba1a6106bd3ded44
    privileged: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=unix:///data/docker.sock
      - --data-root=/data/engine
      - --exec-root=/data/exec
      - --pidfile=/data/docker.pid
      - --storage-driver=overlay2
    ports:
      - "8531:80/tcp"
      - "8532:443/tcp"
      - "8532:443/udp"
    volumes:
      - ${APP_DATA_DIR}/data/docker:/data
      - ${APP_DATA_DIR}/data/coolify:/data/coolify
    healthcheck:
      test: ["CMD-SHELL", "docker -H unix:///data/docker.sock info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Coolify's Docker Desktop mode controls its local server through SSH. This
  # bridge exposes only the isolated Docker daemon above.
  coolify-testing-host:
    image: docker:28.0.4-dind@sha256:ddb0033088b4fab74881ade341a582e3c6c8021b82377703ba1a6106bd3ded44
    init: true
    restart: on-failure
    environment:
      DOCKER_TLS_CERTDIR: ""
      DOCKER_HOST: "unix:///var/run/docker.sock"
    depends_on:
      coolify-permissions:
        condition: service_completed_successfully
      coolify-docker:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -x
        if ! command -v sshd >/dev/null 2>&1; then
          apk update && apk add --no-cache openssh-server bash curl git jq
          ssh-keygen -A
        fi
        passwd -u root 2>/dev/null || passwd -d root
        mkdir -p /run/sshd /var/empty /root/.ssh
        echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFuGmoeGq/pojrsyP1pszcNVuZx9iFkCELtxrh31QJ68 coolify@coolify-instance" > /root/.ssh/authorized_keys
        chmod 700 /root/.ssh
        chmod 600 /root/.ssh/authorized_keys
        chmod 755 /var/empty
        sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config 2>/dev/null || true
        sed -i 's/#PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null || true
        while [ ! -S /docker-socket/docker.sock ]; do sleep 1; done
        ln -sf /docker-socket/docker.sock /var/run/docker.sock
        exec /usr/sbin/sshd -D -e -o ListenAddress=0.0.0.0 -o Port=22
    volumes:
      - ${APP_DATA_DIR}/data/docker:/docker-socket
      - ${APP_DATA_DIR}/data/coolify:/data/coolify
    networks:
      default:
        aliases:
          - host.docker.internal
    healthcheck:
      test: ["CMD-SHELL", "docker -H unix:///var/run/docker.sock info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  coolify-db:
    image: postgres:15@sha256:c189d272e4fcdd1ac419adee675d30be3d389c22ee770d593f15819d22a68a0d
    restart: on-failure
    environment:
      POSTGRES_USER: coolify
      POSTGRES_PASSWORD: ${APP_COOLIFY_DB_PASSWORD}
      POSTGRES_DB: coolify
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  coolify-redis:
    image: redis:7.4.7-alpine3.21@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    restart: on-failure
    environment:
      REDIS_PASSWORD: ${APP_COOLIFY_REDIS_PASSWORD}
    command:
      - redis-server
      - --save
      - "20"
      - "1"
      - --loglevel
      - warning
      - --requirepass
      - ${APP_COOLIFY_REDIS_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s

  coolify-realtime:
    image: ghcr.io/coollabsio/coolify-realtime:1.0.16@sha256:b5bb9d1c95d9b4ca59773b82d1e1a2bf4ccac5fbed33be19b9b3906574db3629
    restart: on-failure
    depends_on:
      coolify-permissions:
        condition: service_completed_successfully
    environment:
      APP_NAME: Coolify
      SOKETI_DEBUG: "false"
      SOKETI_DEFAULT_APP_ID: ${APP_COOLIFY_PUSHER_ID}
      SOKETI_DEFAULT_APP_KEY: ${APP_COOLIFY_PUSHER_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${APP_COOLIFY_PUSHER_SECRET}
      SOKETI_HOST: 0.0.0.0
    ports:
      - "6001:6001/tcp"
      - "6002:6002/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/coolify/ssh:/var/www/html/storage/app/ssh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ready >/dev/null && wget -qO- http://127.0.0.1:6002/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  web:
    image: ghcr.io/coollabsio/coolify:4.7.6@sha256:95d25ed900d0f0cb6e621c3bade63efdf1df85ba5c63e76ae3c92beba1debb90
    restart: on-failure
    working_dir: /var/www/html
    env_file:
      - ${APP_DATA_DIR}/coolify.env
    environment:
      APP_ENV: production
      PHP_MEMORY_LIMIT: 512M
      PHP_FPM_PM_CONTROL: dynamic
      PHP_FPM_PM_START_SERVERS: 1
      PHP_FPM_PM_MIN_SPARE_SERVERS: 1
      PHP_FPM_PM_MAX_SPARE_SERVERS: 10
    volumes:
      - ${APP_DATA_DIR}/coolify.env:/var/www/html/.env:ro
      - ${APP_DATA_DIR}/data/coolify:/data/coolify
      - ${APP_DATA_DIR}/data/coolify/ssh:/var/www/html/storage/app/ssh
      - ${APP_DATA_DIR}/data/coolify/applications:/var/www/html/storage/app/applications
      - ${APP_DATA_DIR}/data/coolify/databases:/var/www/html/storage/app/databases
      - ${APP_DATA_DIR}/data/coolify/services:/var/www/html/storage/app/services
      - ${APP_DATA_DIR}/data/coolify/backups:/var/www/html/storage/app/backups
      - ${APP_DATA_DIR}/data/coolify/webhooks-during-maintenance:/var/www/html/storage/app/webhooks-during-maintenance
    depends_on:
      coolify-permissions:
        condition: service_completed_successfully
      coolify-db:
        condition: service_healthy
      coolify-redis:
        condition: service_healthy
      coolify-realtime:
        condition: service_healthy
      coolify-testing-host:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
